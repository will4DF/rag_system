name: Keep Streamlit App Awake

on:
  schedule:
    # Every 8 hours — comfortably under Streamlit Community Cloud's 12-hour
    # inactivity sleep threshold, so the app never actually goes to sleep.
    - cron: "0 */8 * * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sSf --max-time 30 https://ragsystem-451.streamlit.app/ > /dev/null \
            && echo "App pinged successfully" \
            || echo "Ping failed — app may currently be asleep or redeploying, will retry next run"